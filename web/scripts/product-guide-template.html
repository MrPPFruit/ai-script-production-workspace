r:1px solid var(--line);border-radius:10px;background:var(--paper);box-shadow:0 18px 50px rgba(27,48,38,.05)}.manual>h1:first-child{margin-top:0;font-size:38px}.manual h1,.manual h2,.manual h3,.manual h4{scroll-margin-top:82px;font-family:Georgia,"Songti SC","Noto Serif SC",serif;line-height:1.35}.manual h1{margin:0 0 18px;font-size:34px}.manual h2{margin:50px 0 17px;padding-top:8px;border-top:1px solid var(--line);font-size:27px}.manual h3{margin:31px 0 12px;font-size:21px}.manual h4{margin:24px 0 10px;font-size:17px}.manual p{margin:11px 0;color:#445149}.manual strong{color:#27372f}.manual a{color:var(--green);text-underline-offset:3px}.manual blockquote{margin:20px 0 30px;padding:16px 18px;border-left:4px solid var(--green);background:#eef5f1;color:#3e5549}.manual blockquote p{margin:2px 0;color:inherit}.manual ul,.manual ol{padding-left:24px}.manual li{margin:6px 0}.manual hr{border:0;border-top:1px solid var(--line);margin:38px 0}.manual code{padding:.15em .38em;border-radius:4px;background:#eef2ef;color:#294f3d;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.manual pre{overflow:auto;padding:16px;border-radius:7px;background:#17251f;color:#eef8f1}.manual pre code{padding:0;background:none;color:inherit}.manual table{display:block;width:100%;overflow-x:auto;margin:18px 0 26px;border-collapse:collapse;font-size:13px}.manual th,.manual td{min-width:140px;padding:10px 12px;border:1px solid var(--line);text-align:left;vertical-align:top}.manual th{background:#eef3f0;color:#2d4237;font-weight:700}.manual tr:nth-child(even) td{background:#fafcfb}.manual input[type=checkbox]{margin-right:7px;accent-color:var(--green)}.manual h2:nth-of-type(7)+p,.manual h2:nth-of-type(7)+ul{color:#414d47}.footer{padding:0 18px 44px;text-align:center;color:#7a847e;font-size:12px}.footer a{color:var(--green)}@media(max-width:900px){.layout{grid-template-columns:1fr;gap:20px;padding-top:20px}.toc-shell{position:static;max-height:320px}.manual{padding:31px 26px 44px}.manual>h1:first-child{font-size:31px}.manual h2{font-size:23px}.top-actions a:nth-child(2){display:none}}@media(max-width:560px){.topbar{min-height:56px;padding:0 12px}.brand{font-size:15px}.top-actions{gap:6px}.top-actions a{min-height:31px;padding:0 8px;font-size:12px}.layout{width:min(100% - 18px,1260px)}.manual{padding:25px 17px 38px;border-radius:7px}.manual>h1:first-child{font-size:27px}.manual h2{margin-top:40px}.manual th,.manual td{min-width:124px;padding:8px 9px}}
